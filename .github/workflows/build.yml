name: Android Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: image-downloader-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.compatibility.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        run: |
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          checksum=$(curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256)
          echo "$checksum  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Test infinite-scroll scheduling
        run: node ci/test-infinite-scroll.js
      - name: Determine version and build release
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          version="1.2.${count}-$(git rev-parse --short=8 HEAD)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "COUNT=$count" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          gradle testReleaseUnitTest assembleRelease -PcommitCount="$count" -PappVersion="$version"
      - name: Sign and verify installable release
        env:
          ANDROID_RELEASE_KEY_PEM: ${{ secrets.ANDROID_RELEASE_KEY_PEM }}
        run: |
          set -eu
          trap 'rm -f "$RUNNER_TEMP/signer.pk8" "$RUNNER_TEMP/signer.der"' EXIT
          /usr/bin/python3 ci/release-signing.py
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f -P 16 4 build/outputs/apk/release/*-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --key "$RUNNER_TEMP/signer.pk8" --cert "$RUNNER_TEMP/signer.der" --out Image-Downloader.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs Image-Downloader.apk
          "$tools/aapt" dump badging Image-Downloader.apk | grep -F "package: name='app.imagedownloader' versionCode='$COUNT' versionName='$VERSION'"
      - name: Check compatibility with the previous signed release
        id: compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          previous=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -r --arg current "v$VERSION" '[.[][] | select(.draft==false and .prerelease==false and .tag_name!=$current and (.tag_name|test("^v[0-9]+[.][0-9]+[.][0-9]+-[0-9a-f]{8,40}$")) and any(.assets[]?; .name=="Image-Downloader.apk" and .state=="uploaded"))] | sort_by(.tag_name|split("-")[0]|split(".")[-1]|tonumber) | last | .tag_name // empty')
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if [[ -z "$previous" ]]; then
            echo "No preceding signed release; establishing baseline."
            exit 0
          fi
          mkdir "$RUNNER_TEMP/previous"
          gh release download "$previous" -p Image-Downloader.apk -D "$RUNNER_TEMP/previous"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          cert() { "$tools/apksigner" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'; }
          old="$RUNNER_TEMP/previous/Image-Downloader.apk"
          current_cert=$(cert Image-Downloader.apk)
          test -n "$current_cert" && test "$current_cert" = "$(cert "$old")"
          old_code=$("$tools/aapt" dump badging "$old" | awk -F"'" '/^package:/{print $4}')
          test "$COUNT" -gt "$old_code"
      - name: Publish to Releases and verify download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" Image-Downloader.apk --target "$GITHUB_SHA" --title "Image Downloader $VERSION" --notes "Commit $GITHUB_SHA" --latest
          fi
          info=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          asset=$(jq -er '.assets[] | select(.name=="Image-Downloader.apk") | .id' <<< "$info")
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/published.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/published.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/published.apk" | grep -F "versionCode='$COUNT' versionName='$VERSION'"
      - name: Verify anonymous public release access
        if: github.event.repository.private == false
        run: |
          set -eu
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest"
          info=$(curl -fsSL --retry 3 "$url")
          test "$(jq -r .tag_name <<< "$info")" = "v$VERSION"
          apk_url=$(jq -er '.assets[] | select(.name=="Image-Downloader.apk") | .browser_download_url' <<< "$info")
          digest=$(jq -er '.assets[] | select(.name=="Image-Downloader.apk") | .digest' <<< "$info")
          curl -fsSL --retry 3 "$apk_url" -o "$RUNNER_TEMP/anonymous.apk"
          echo "${digest#sha256:}  $RUNNER_TEMP/anonymous.apk" | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/anonymous.apk"
  test-update:
    if: github.event.repository.private == false && (contains(github.event.head_commit.message, '[test-update]') || github.event_name == 'workflow_dispatch')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch preceding signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.release.outputs.previous }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          if [[ -z "$PREVIOUS_TAG" || -z "$VERSION" ]]; then
            echo "::error::The updater test requires a preceding signed APK and a target version."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$PREVIOUS_TAG" -p Image-Downloader.apk -D "$RUNNER_TEMP/previous"
          test -s "$RUNNER_TEMP/previous/Image-Downloader.apk"
          curl -fsSL --retry 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Image-Downloader.apk" -o "$RUNNER_TEMP/current.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise in-place update from the preceding release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 ci/test-update.py
