plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'app.imagedownloader'
    compileSdk 35
    defaultConfig {
        applicationId 'app.imagedownloader'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging { resources.excludes += ['META-INF/versions/**', 'META-INF/DEPENDENCIES'] }
}
dependencies { implementation 'org.jsoup:jsoup:1.18.3' }
