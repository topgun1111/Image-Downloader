plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'app.imagedownloader'
    compileSdk 35
    defaultConfig {
        applicationId 'app.imagedownloader'
        minSdk 29
        targetSdk 35
        versionCode providers.gradleProperty('commitCount').orElse(providers.exec { commandLine 'git', 'rev-list', '--count', 'HEAD' }.standardOutput.asText.map { it.trim() }).get().toInteger()
        versionName providers.gradleProperty('appVersion').getOrElse("1.2.${versionCode}-local")
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging { resources.excludes += ['META-INF/versions/**', 'META-INF/DEPENDENCIES'] }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.google.mlkit:translate:17.0.3'
    // Kotlin 1.8 merged the JDK extensions into stdlib; align ML Kit's older transitives.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
